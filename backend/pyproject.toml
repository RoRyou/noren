[project]
name = "noren-backend"
version = "0.1.0"
description = "NOREN：テーブルの AI と話しているうちに食べたいものが決まる、飲食店の接客エージェント"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "google-genai>=2.29",
    "google-adk>=2.11",
    "google-cloud-firestore>=2.19",
    "pydantic-settings>=2.4",
    "python-dotenv>=1.0",
    "google-cloud-tasks>=2.16",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
